name: Signal-Radar

# Taktgeber: Jeder Lauf startet am Ende selbst den nächsten (Kette).
# Börsenzeit Mo–Fr 6–21 Uhr UTC: alle ~10 Minuten, sonst stündlich.
# Die Zeitpläne unten sind nur Reserve, falls die Kette einmal abreißt.
on:
  schedule:
    - cron: "*/10 6-20 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick oder full"
        default: "quick"
  push:
    branches: [main]
    paths: ["config.json", "presets.json", "bot.py", "learn.py", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: signal-radar
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse laden und analysieren
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '*/10 6-20 * * 1-5' || github.event.schedule == '0 * * * *') && 'quick' || 'full' }}
        run: python bot.py --no-push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: push
          path: push.json

  app-aktualisieren:
    needs: analyse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  push-senden:
    needs: app-aktualisieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: push
      - name: Push-Nachricht senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEPOT: ${{ secrets.DEPOT }}
        run: python bot.py --notify

  naechster-lauf:
    needs: [analyse, app-aktualisieren, push-senden]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Warten und nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s); dow=$(date -u +%u); hour=$(date -u +%H | sed 's/^0//')
          if [ "$dow" -le 5 ] && [ "${hour:-0}" -ge 6 ] && [ "${hour:-0}" -le 20 ]; then wait=480; else wait=3300; fi
          echo "Warte ${wait}s bis zum nächsten Lauf"
          sleep "$wait"
          h=$(date -u +%H); m=$(date -u +%M)
          mode=quick
          if { [ "$h" = "07" ] || [ "$h" = "18" ]; } && [ "${m#0}" -lt 12 ]; then mode=full; fi
          for t in 1 2 3 4 5 6; do gh workflow run signal-bot.yml --ref main -f mode="$mode" && break; echo "Versuch $t fehlgeschlagen, neuer Versuch in 30s"; sleep 30; done
          echo "Nächster Lauf gestartet ($mode)"
