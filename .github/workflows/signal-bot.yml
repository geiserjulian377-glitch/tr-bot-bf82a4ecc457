name: Trading-Signal-Bot

on:
  schedule:
    # Mo–Fr 18:07 UTC (= 19:07 Uhr Winterzeit / 20:07 Uhr Sommerzeit), nach Xetra-Schluss
    - cron: "7 18 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config.json", "presets.json", "bot.py", "render.py"]

permissions:
  contents: write

jobs:
  signale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Signale berechnen und senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py
      - name: Dashboard im Repo speichern
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Dashboard aktualisiert [skip ci]" || true
          git push || true
