name: Signal-Radar

on:
  schedule:
    # Zeiten in UTC (Winterzeit +1 Std., Sommerzeit +2 Std.)
    - cron: "20 7 * * 1-5"    # ca. 8:20 Uhr: Morgen-Check vor Börsenstart
    - cron: "50 14 * * 1-5"   # ca. 15:50 Uhr: kurz nach US-Börsenstart
    - cron: "7 18 * * 1-5"    # ca. 19:07 Uhr: Abend-Update nach Börsenschluss
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config.json", "presets.json", "bot.py", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-radar
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse laden und analysieren
        run: python bot.py --no-push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: push
          path: push.json

  app-aktualisieren:
    needs: analyse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  push-senden:
    needs: app-aktualisieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: push
      - name: Push-Nachricht senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py --notify
