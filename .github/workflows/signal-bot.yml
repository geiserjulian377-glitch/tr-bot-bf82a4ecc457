name: Signal-Radar

on:
  schedule:
    # Zeiten in UTC (Winterzeit +1 Std., Sommerzeit +2 Std.)
    - cron: "*/10 6-20 * * 1-5"  # Live: ca. alle 10 Min. von 7 bis 22 Uhr (schnell, Analysten aus Cache)
    - cron: "20 7 * * 1-5"       # Voll-Lauf am Morgen (Analysten neu)
    - cron: "7 18 * * 1-5"       # Voll-Lauf am Abend mit Tagesbericht
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config.json", "presets.json", "bot.py", "learn.py", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-radar
  cancel-in-progress: false

# Ein Lauf darf nie länger als 9 Minuten dauern, sonst stauen sich die 10-Minuten-Läufe


jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse laden und analysieren
        env:
          RUN_MODE: ${{ github.event.schedule == '*/10 6-20 * * 1-5' && 'quick' || 'full' }}
        run: python bot.py --no-push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: push
          path: push.json

  app-aktualisieren:
    needs: analyse
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  push-senden:
    needs: app-aktualisieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: push
      - name: Push-Nachricht senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py --notify
